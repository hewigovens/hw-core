[package]
name = "hw-wallet"
version.workspace = true
edition.workspace = true
description = "Shared wallet orchestration utilities for CLI and FFI"
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
bitcoin = { workspace = true }
ledger_bitcoin_client = { workspace = true }
base64 = "0.23"
ble-transport = { workspace = true }
bs58 = { workspace = true }
hex = { workspace = true }
hw-chain = { workspace = true }
ledger-connect = { workspace = true }
k256 = { version = "0.14", features = ["ecdsa"] }
rlp = "0.6.1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha3 = "0.12"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
trezor-connect = { workspace = true, features = ["ble"] }
tracing = { workspace = true }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
trezor-connect = { workspace = true, features = ["ble", "test-support"] }

name: iOS CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust with iOS target
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Set up mbx build cache
        uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        with:
          cache-key-suffix: ios

      - name: cargo check (iOS)
        run: mbx check -p hw-ffi --target aarch64-apple-ios

      - name: Generate sample app projects (iOS + macOS)
        run: |
          brew install xcodegen xcbeautify
          just xcframework
          # Exercise a relocated consumer with no Cargo target/ or repository sources.
          CONSUMER_DIR="$RUNNER_TEMP/hwcore-consumer"
          mkdir -p "$CONSUMER_DIR/apple"
          cp -R target/xcframework/HWCoreKit "$CONSUMER_DIR/apple/"
          cp -R apple/HWCoreKitSampleApp "$CONSUMER_DIR/apple/"
          cp justfile "$CONSUMER_DIR/"
          echo "CONSUMER_DIR=$CONSUMER_DIR" >> "$GITHUB_ENV"
          cd "$CONSUMER_DIR"
          just generate-apple-projects

      - name: Run HWCoreKit Swift package tests
        working-directory: ${{ env.CONSUMER_DIR }}
        run: swift test --package-path apple/HWCoreKit

      - name: Run iOS sample app UI smoke tests
        working-directory: ${{ env.CONSUMER_DIR }}
        run: just smoke-ios-ui

      - name: Build iOS device sample app
        working-directory: ${{ env.CONSUMER_DIR }}
        run: |
          set -o pipefail
          xcodebuild -project apple/HWCoreKitSampleApp/HWCoreKitSampleAppiOS.xcodeproj -scheme HWCoreKitSampleAppiOS -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | xcbeautify

      - name: Build macOS sample app
        working-directory: ${{ env.CONSUMER_DIR }}
        run: |
          set -o pipefail
          xcodebuild -project apple/HWCoreKitSampleApp/HWCoreKitSampleAppMac.xcodeproj -scheme HWCoreKitSampleAppMac -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build | xcbeautify
